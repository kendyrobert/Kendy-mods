    <input id="code" placeholder="XXXX-XXXX-XXXX" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWr9YM0YAG0mx0SEk3qNEhjeS1MOu_2lg",
  authDomain: "kendy-57bcd.firebaseapp.com",
  databaseURL: "https://kendy-57bcd-default-rtdb.firebaseio.com",
  projectId: "kendy-57bcd",
  storageBucket: "kendy-57bcd.firebasestorage.app",
  messagingSenderId: "678778497788",
  appId: "1:678778497788:web:e1459854025fd4a1f98579",
  measurementId: "G-Z3GD2Y1588"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.database();
const TS=firebase.database.ServerValue.TIMESTAMP;
const $=id=>document.getElementById(id);

const AWAY=10000;   /* milisegundos fuera de la p谩gina antes de cerrar la sesi贸n */
const BEAT=4000;    /* cada cu谩nto se avisa al servidor que la sesi贸n sigue activa */

const LS={
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeUrl(u){return /^https?:\/\//i.test(u)?u:"#"}
function normalize(s){
  const t=String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
  const g=t.match(/.{1,4}/g);
  return g?g.join("-"):"";
}

let code=null, beat=null, awayT=null, hiddenAt=0, starting=false;

function showGate(msg){
  $("content").style.display="none";$("gate").style.display="block";$("out").style.display="none";
  $("msg").textContent=msg||"";$("enter").disabled=false;$("code").value="";
}
function showContent(){
  $("gate").style.display="none";$("content").style.display="block";$("out").style.display="block";
}
function render(snap){
  const arr=[];
  snap.forEach(ch=>{const v=ch.val();if(v&&v.name&&v.url)arr.push([v.name,v.url,v.ts||0])});
  arr.sort((a,b)=>b[2]-a[2]);
  $("list").innerHTML=arr.length
    ? arr.map(b=>`<a class="btn" href="${esc(safeUrl(b[1]))}" target="_blank" rel="noopener">${esc(b[0])}</a>`).join("")
    : '<p class="note">A煤n no hay descargas.</p>';
}

async function closeSession(msg){
  clearInterval(beat);clearTimeout(awayT);hiddenAt=0;
  try{db.ref("privado").off()}catch(e){}
  const c=code||LS.get("kendy_dp_code");
  const u=auth.currentUser;
  code=null;
  LS.del("kendy_dp_code");LS.del("kendy_dp_last");
  $("list").innerHTML="";
  showGate(msg);
  /* se borra el c贸digo y la sesi贸n en la base de datos */
  try{if(c)await db.ref("codigos/"+c).remove()}catch(e){}
  try{if(u)await db.ref("sesiones/"+u.uid).remove()}catch(e){}
  try{if(u)await u.delete()}catch(e){try{await auth.signOut()}catch(_){}}
}

async function pulse(){
  if(!code)return;
  try{
    await db.ref("codigos/"+code+"/last").set(TS);
    LS.set("kendy_dp_last",String(Date.now()));
  }catch(e){
    closeSession("La sesi贸n termin贸. Necesitas un c贸digo nuevo.");
  }
}

function startSession(){
  showContent();
  clearInterval(beat);
  beat=setInterval(()=>{if(!document.hidden)pulse()},BEAT);
  db.ref("privado").on("value",render,()=>closeSession("No se pudo abrir la sesi贸n. Necesitas un c贸digo nuevo."));
}

async function enter(){
  if(starting)return;
  const c=normalize($("code").value);
  if(c.length!==14){$("msg").textContent="Escribe el c贸digo completo.";return}
  starting=true;$("enter").disabled=true;$("msg").textContent="Verificando...";
  try{
    if(!auth.currentUser)await auth.signInAnonymously();
    const uid=auth.currentUser.uid;
    /* 1) se "quema" el c贸digo: solo se puede si existe y nadie lo us贸 antes */
    try{await db.ref("codigos/"+c+"/usadoPor").set(uid)}catch(e){}
    /* 2) se abre la sesi贸n */
    try{await db.ref("sesiones/"+uid).set(c)}catch(e){}
    /* 3) primer aviso de actividad: solo funciona si el c贸digo ya es m铆o */
    await db.ref("codigos/"+c+"/last").set(TS);
    code=c;
    LS.set("kendy_dp_code",c);LS.set("kendy_dp_last",String(Date.now()));
    startSession();
  }catch(e){
    $("msg").textContent="C贸digo inv谩lido o ya usado.";$("enter").disabled=false;
    try{if(auth.currentUser)await auth.currentUser.delete()}catch(_){}
  }
  starting=false;
}
$("enter").onclick=enter;
$("code").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});
$("out").onclick=()=>closeSession("Sesi贸n cerrada.");

/* ===== si sales de la p谩gina AWAY milisegundos, se cierra ===== */
document.addEventListener("visibilitychange",()=>{
  if(!code)return;
  if(document.hidden){
    hiddenAt=Date.now();
    clearTimeout(awayT);
    awayT=setTimeout(()=>closeSession("Saliste de la p谩gina. Necesitas un c贸digo nuevo."),AWAY);
  }else{
    clearTimeout(awayT);
    if(hiddenAt&&Date.now()-hiddenAt>=AWAY){closeSession("Saliste de la p谩gina. Necesitas un c贸digo nuevo.")}
    else{hiddenAt=0;pulse()}
  }
});
window.addEventListener("pagehide",()=>{if(code)LS.set("kendy_dp_last",String(Date.now()))});

/* ===== al abrir/recargar la p谩gina ===== */
let init=false;
auth.onAuthStateChanged(async u=>{
  if(init)return;init=true;
  const c=LS.get("kendy_dp_code");
  if(!c){showGate("");if(u){try{await u.delete()}catch(e){}}return}
  const last=+LS.get("kendy_dp_last")||0;
  if(u&&Date.now()-last<AWAY){
    code=c;
    try{await db.ref("codigos/"+c+"/last").set(TS);LS.set("kendy_dp_last",String(Date.now()));startSession()}
    catch(e){closeSession("La sesi贸n termin贸. Necesitas un c贸digo nuevo.")}
  }else{
    closeSession("La sesi贸n se cerr贸. Necesitas un c贸digo nuevo.");
  }
});
</script>
