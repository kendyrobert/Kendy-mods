<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kendy mods - Descargas directas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Arial,sans-serif;background:#0f1020;color:#eee;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#ff3d71,#7c4dff);padding:12px 16px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
header button{width:auto;margin:0;padding:6px 14px;font-size:14px;background:#0008}
main{max-width:720px;margin:auto;padding:16px}
h2{margin:20px 0 12px;color:#ffd54f;text-align:center}
.box{background:#1b1c35;border:2px solid #ff3d71;border-radius:16px;padding:24px;max-width:400px;margin:40px auto;text-align:center}
.box p{margin:10px 0}
input{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:1px solid #555;background:#0f1020;color:#fff;font-size:20px;text-align:center;letter-spacing:2px;text-transform:uppercase}
input.adm{text-transform:none;letter-spacing:0;font-size:16px}
button{display:block;width:100%;padding:14px;margin:8px 0;border:0;border-radius:12px;font-size:18px;font-weight:800;color:#fff;cursor:pointer;background:linear-gradient(90deg,#00c853,#00b0ff)}
button:disabled{background:#555;color:#bbb}
#msg,#amsg{color:#ffd54f;min-height:24px}
.small{color:#aaa;font-size:13px}
a{color:#4dd0e1}
#adminbox{display:none;margin-top:10px;border-top:1px solid #444;padding-top:10px}
.btn{display:block;width:100%;max-width:420px;margin:12px auto;padding:16px;border-radius:12px;font-size:18px;font-weight:800;color:#fff;text-decoration:none;text-align:center;background:linear-gradient(90deg,#2979ff,#7c4dff)}
.btn:active{opacity:.8}
.note{text-align:center;color:#aaa;font-size:14px;margin-top:20px}
footer{text-align:center;padding:20px;color:#888;font-size:13px}
#content{display:none}
.wa{position:fixed;right:16px;bottom:16px;z-index:10;width:60px;height:60px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0008}
.wa svg{width:34px;height:34px;fill:#fff}
</style>
</head>
<body>
<header><div>🔥 Kendy mods · Descargas directas</div><button id="out" style="display:none">Salir</button></header>
<main>
  <div id="gate" class="box">
    <h2 style="margin-top:0">🔑 Ingresa tu código</h2>
    <p class="small">Tu código es de <b>un solo uso</b>. Si sales de esta página más de 10 segundos, la sesión se cierra y necesitarás otro código.</p>
    <input id="code" placeholder="XXXX-XXXX-XXXX" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <button id="enter">Entrar</button>
    <p id="msg"></p>

    <p class="small" style="margin-top:18px"><a href="#" id="adminlink">Soy admin</a></p>
    <div id="adminbox">
      <input id="aem" class="adm" type="email" placeholder="Correo" autocomplete="username">
      <input id="apw" class="adm" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button id="alogin">Entrar como admin</button>
      <p id="amsg"></p>
    </div>
  </div>

  <div id="content">
    <h2>⬇ Todas las descargas</h2>
    <div id="list"></div>
    <p class="note" id="note">⚠ Si sales de esta página más de 10 segundos, la sesión se cierra.</p>
  </div>
</main>
<footer>© Kendy mods</footer>

<a class="wa" href="https://whatsapp.com/channel/0029Vb9K8MS6xCSIyFjwCv40" target="_blank" rel="noopener" aria-label="WhatsApp">
<svg viewBox="0 0 32 32"><path d="M16 3C9 3 3.4 8.6 3.4 15.5c0 2.3.6 4.4 1.7 6.3L3 29l7.4-2c1.8 1 3.800 1.500 5.600 1.500 7 0 12.600-5.600 12.600-12.500S23 3 16 3zm0 22.800c-1.800 0-3.500-.5-5-1.400l-.4-.2-4.400 1.200 1.200-4.300-.3-.4a10 10 0 0 1-1.500-5.300C5.600 9.900 10.300 5.300 16 5.300s10.400 4.600 10.400 10.200S21.700 25.800 16 25.800zm5.700-7.500c-.3-.2-1.800-.9-2.100-1-.3-.1-.5-.2-.7.200s-.8 1-1 1.200c-.2.200-.4.200-.7.100-.3-.2-1.300-.5-2.500-1.500-.9-.8-1.500-1.800-1.700-2.100-.2-.3 0-.5.100-.6l.5-.5c.1-.2.200-.3.300-.5.100-.2.100-.4 0-.5l-1-2.300c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400-.3.300-1.100 1-1.100 2.600s1.100 3 1.300 3.200c.2.200 2.200 3.400 5.400 4.700 3.200 1.300 3.200.9 3.800.8.600-.1 1.800-.7 2.100-1.500.3-.7.300-1.300.2-1.500-.1-.2-.3-.3-.6-.4z"/></svg>
</a>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAWr9YM0YAG0mx0SEk3qNEhjeS1MOu_2lg",
  authDomain: "kendy-57bcd.firebaseapp.com",
  databaseURL: "https://kendy-57bcd-default-rtdb.firebaseio.com",
  projectId: "kendy-57bcd",
  storageBucket: "kendy-57bcd.firebasestorage.app",
  messagingSenderId: "678778497788",
  appId: "1:678778497788:web:e1459854025fd4a1f98579",
  measurementId: "G-Z3GD2Y1588"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.database();
const TS=firebase.database.ServerValue.TIMESTAMP;
const $=id=>document.getElementById(id);

const AWAY=10000;   /* milisegundos fuera de la página antes de cerrar la sesión */
const BEAT=4000;    /* cada cuánto se avisa al servidor que la sesión sigue activa */

const LS={
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},
  del:k=>{try{localStorage.removeItem(k)}catch(e){}}
};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeUrl(u){return /^https?:\/\//i.test(u)?u:"#"}
function normalize(s){
  const t=String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");
  const g=t.match(/.{1,4}/g);
  return g?g.join("-"):"";
}

let code=null, beat=null, awayT=null, hiddenAt=0, starting=false, admin=false;

function showGate(msg){
  $("content").style.display="none";$("gate").style.display="block";$("out").style.display="none";
  $("msg").textContent=msg||"";$("enter").disabled=false;$("code").value="";
  $("adminbox").style.display="none";$("amsg").textContent="";$("apw").value="";$("alogin").disabled=false;
}
function showContent(){
  $("gate").style.display="none";$("content").style.display="block";$("out").style.display="block";
}
function render(snap){
  const arr=[];
  snap.forEach(ch=>{const v=ch.val();if(v&&v.name&&v.url)arr.push([v.name,v.url,v.ts||0])});
  arr.sort((a,b)=>b[2]-a[2]);
  $("list").innerHTML=arr.length
    ? arr.map(b=>`<a class="btn" href="${esc(safeUrl(b[1]))}" target="_blank" rel="noopener">${esc(b[0])}</a>`).join("")
    : '<p class="note">Aún no hay descargas.</p>';
}

/* ===== SESIÓN DE ADMIN (sin código, sin límite de tiempo) ===== */
function startAdmin(){
  admin=true;
  clearInterval(beat);clearTimeout(awayT);
  $("note").style.display="none";
  showContent();
  db.ref("privado").on("value",render,()=>adminOut("No se pudo leer la lista. Revisa las reglas de Firebase."));
}
async function adminOut(msg){
  admin=false;
  try{db.ref("privado").off()}catch(e){}
  $("list").innerHTML="";
  showGate(msg);
  try{await auth.signOut()}catch(e){}   /* solo se cierra sesión: la cuenta de admin NUNCA se borra */
}
async function adminLogin(){
  const em=$("aem").value.trim(), pw=$("apw").value;
  if(!em||!pw){$("amsg").textContent="Escribe correo y contraseña.";return}
  $("alogin").disabled=true;$("amsg").textContent="Entrando...";
  try{
    await auth.signInWithEmailAndPassword(em,pw);
    $("apw").value="";$("amsg").textContent="";$("alogin").disabled=false;
    startAdmin();
  }catch(e){
    $("amsg").textContent="Correo o contraseña incorrectos.";$("alogin").disabled=false;
  }
}
$("adminlink").onclick=e=>{
  e.preventDefault();
  const b=$("adminbox");
  b.style.display=b.style.display==="block"?"none":"block";
};
$("alogin").onclick=adminLogin;
$("apw").addEventListener("keydown",e=>{if(e.key==="Enter")adminLogin()});

/* ===== SESIÓN DE INVITADO (con código) ===== */
async function closeSession(msg){
  clearInterval(beat);clearTimeout(awayT);hiddenAt=0;
  try{db.ref("privado").off()}catch(e){}
  const c=code||LS.get("kendy_dp_code");
  const u=auth.currentUser;
  const anon=!!(u&&u.isAnonymous);   /* solo se borran cuentas anónimas, nunca la del admin */
  code=null;
  LS.del("kendy_dp_code");LS.del("kendy_dp_last");
  $("list").innerHTML="";
  showGate(msg);
  /* se borra el código y la sesión en la base de datos */
  try{if(c)await db.ref("codigos/"+c).remove()}catch(e){}
  try{if(anon)await db.ref("sesiones/"+u.uid).remove()}catch(e){}
  try{if(anon)await u.delete()}catch(e){try{await auth.signOut()}catch(_){}}
}

async function pulse(){
  if(!code)return;
  try{
    await db.ref("codigos/"+code+"/last").set(TS);
    LS.set("kendy_dp_last",String(Date.now()));
  }catch(e){
    closeSession("La sesión terminó. Necesitas un código nuevo.");
  }
}

function startSession(){
  $("note").style.display="block";
  showContent();
  clearInterval(beat);
  beat=setInterval(()=>{if(!document.hidden)pulse()},BEAT);
  db.ref("privado").on("value",render,()=>closeSession("No se pudo abrir la sesión. Necesitas un código nuevo."));
}

async function enter(){
  if(starting)return;
  const c=normalize($("code").value);
  if(c.length!==14){$("msg").textContent="Escribe el código completo.";return}
  starting=true;$("enter").disabled=true;$("msg").textContent="Verificando...";
  try{
    if(!auth.currentUser)await auth.signInAnonymously();
    const uid=auth.currentUser.uid;
    /* 1) se "quema" el código: solo se puede si existe y nadie lo usó antes */
    try{await db.ref("codigos/"+c+"/usadoPor").set(uid)}catch(e){}
    /* 2) se abre la sesión */
    try{await db.ref("sesiones/"+uid).set(c)}catch(e){}
    /* 3) primer aviso de actividad: solo funciona si el código ya es mío */
    await db.ref("codigos/"+c+"/last").set(TS);
    code=c;
    LS.set("kendy_dp_code",c);LS.set("kendy_dp_last",String(Date.now()));
    startSession();
  }catch(e){
    $("msg").textContent="Código inválido o ya usado.";$("enter").disabled=false;
    try{if(auth.currentUser&&auth.currentUser.isAnonymous)await auth.currentUser.delete()}catch(_){}
  }
  starting=false;
}
$("enter").onclick=enter;
$("code").addEventListener("keydown",e=>{if(e.key==="Enter")enter()});
$("out").onclick=()=>{admin?adminOut("Sesión cerrada."):closeSession("Sesión cerrada.")};

/* ===== si sales de la página AWAY milisegundos, se cierra (solo invitados) ===== */
document.addEventListener("visibilitychange",()=>{
  if(!code||admin)return;
  if(document.hidden){
    hiddenAt=Date.now();
    clearTimeout(awayT);
    awayT=setTimeout(()=>closeSession("Saliste de la página. Necesitas un código nuevo."),AWAY);
  }else{
    clearTimeout(awayT);
    if(hiddenAt&&Date.now()-hiddenAt>=AWAY){closeSession("Saliste de la página. Necesitas un código nuevo.")}
    else{hiddenAt=0;pulse()}
  }
});
window.addEventListener("pagehide",()=>{if(code)LS.set("kendy_dp_last",String(Date.now()))});

/* ===== al abrir/recargar la página ===== */
let init=false;
auth.onAuthStateChanged(async u=>{
  if(init)return;init=true;
  /* si hay una cuenta real (admin) guardada en este dispositivo, se abre directo y no se borra nada */
  if(u&&!u.isAnonymous){startAdmin();return}
  const c=LS.get("kendy_dp_code");
  if(!c){showGate("");if(u){try{await u.delete()}catch(e){}}return}
  const last=+LS.get("kendy_dp_last")||0;
  if(u&&Date.now()-last<AWAY){
    code=c;
    try{await db.ref("codigos/"+c+"/last").set(TS);LS.set("kendy_dp_last",String(Date.now()));startSession()}
    catch(e){closeSession("La sesión terminó. Necesitas un código nuevo.")}
  }else{
    closeSession("La sesión se cerró. Necesitas un código nuevo.");
  }
});
</script>
</body>
</html>
