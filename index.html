<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Kendy mods - Descargas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Arial,sans-serif;background:#0f1020;color:#eee;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#ff3d71,#7c4dff);padding:12px 16px;font-weight:800}
main{max-width:720px;margin:auto;padding:16px}
h2{margin:16px 0 12px;color:#ffd54f;text-align:center}
.txt{background:#1b1c35;border-radius:14px;padding:18px;margin-bottom:14px}
.txt img{max-width:100%;border-radius:10px;margin:8px 0}
button,.btn{display:block;width:100%;max-width:420px;margin:12px auto;padding:16px;border:0;border-radius:12px;font-size:18px;font-weight:800;color:#fff;text-decoration:none;text-align:center;cursor:pointer;background:linear-gradient(90deg,#00c853,#00b0ff)}
button:disabled{background:#555;color:#bbb}
.yt{background:linear-gradient(90deg,#ff1744,#d50000)}
.dl{background:linear-gradient(90deg,#2979ff,#7c4dff)}
.modal{display:none;position:fixed;inset:0;z-index:50;background:#000d;align-items:center;justify-content:center;padding:20px}
.modal div{background:#1b1c35;border:2px solid #ff3d71;border-radius:16px;padding:24px;max-width:380px;text-align:center}
.modal p{margin:10px 0}
.wa{position:fixed;right:16px;bottom:16px;z-index:10;width:60px;height:60px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:30px;text-decoration:none;box-shadow:0 4px 14px #0008}
footer{text-align:center;padding:20px;color:#888;font-size:13px}
</style>
</head>
<body>
<header>🔥 Kendy mods · Descargas</header>
<main><div id="app"></div></main>
<footer>© Kendy mods</footer>

<div class="modal" id="block"><div>
  <h2 style="margin-top:0">⚠ Desactiva el bloqueador</h2>
  <p>Detectamos un bloqueador de anuncios o DNS. Desactívalo para continuar.</p>
  <button id="retry">Reintentar</button>
</div></div>

<a class="wa" href="https://whatsapp.com/channel/0029Vb9K8MS6xCSIyFjwCv40" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ===== ESTADÍSTICAS (se ven en /stadistik) ===== */
(function(){
  const ZONA="America/Lima";
  if(!firebase.apps.length)firebase.initializeApp({
    apiKey:"AIzaSyAWr9YM0YAG0mx0SEk3qNEhjeS1MOu_2lg",
    authDomain:"kendy-57bcd.firebaseapp.com",
    databaseURL:"https://kendy-57bcd-default-rtdb.firebaseio.com",
    projectId:"kendy-57bcd",
    appId:"1:678778497788:web:e1459854025fd4a1f98579"
  });
  const db=firebase.database();
  window.kTrack=function(n){try{
    const day=new Date().toLocaleDateString("en-CA",{timeZone:ZONA});
    let sid=localStorage.getItem("k_sid"),last=+localStorage.getItem("k_paso")||0;
    if(!sid||localStorage.getItem("k_day")!==day||(n===1&&last>1)){
      sid=Math.random().toString(36).slice(2,12);last=0;
      localStorage.setItem("k_sid",sid);localStorage.setItem("k_day",day);
    }
    if(n>last){
      localStorage.setItem("k_paso",n);
      db.ref("stats/"+day+"/"+sid).set({paso:n,t:firebase.database.ServerValue.TIMESTAMP});
    }
  }catch(e){}};
})();
</script>

<script>
/* ===== CONFIGURA AQUÍ ===== */
const T1=10, T2=10;          /* las dos cuentas regresivas de cada paso (segundos) */
const AWAY=15000;            /* salir de la web 15 s o más reinicia todo */
const FINAL=20;              /* cuenta oculta en descargas antes de reiniciar (segundos) */
const YT="https://youtube.com/@kendymods?si=2CoZ_dAt9j_QMCiT";
const TURNSTILE_KEY="0x4AAAAAAFVNigVcrSGtaVzD";

/* Botones de descarga: agrega más al FINAL de la lista y saldrán ARRIBA en la web */
const DESCARGAS=[
  {n:"⬇ Descargar Free Fire MOD", u:"https://www.mediafire.com/"}
];

/* Texto e imágenes de cada paso (reemplaza con los tuyos) */
const PASOS=[
  "<p>Aquí va el texto e imágenes del paso 1.</p>",
  "<p>Aquí va el texto e imágenes del paso 2.</p>",
  "<p>Aquí va el texto e imágenes del paso 3.</p>",
  "<p>Aquí va el texto e imágenes del paso 4.</p>",
  "<p>Aquí va el texto e imágenes del paso 5.</p>",
  "<p>Aquí va el texto e imágenes del paso 6. Entra al canal de YouTube y vuelve para continuar.</p>"
];

/* ===== LÓGICA ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u)?u:"#";

let paso=1,fase=0,resto=T1,ytClick=false,ytOk=false,enDesc=false,fin=FINAL;
let turnOk=false,bloqueado=false,hiddenAt=0,last=Date.now();

function reset(){
  paso=1;fase=0;resto=T1;ytClick=false;ytOk=false;enDesc=false;fin=FINAL;
  kTrack(1);render();
}

function render(){
  const app=$("app");
  if(enDesc){
    app.innerHTML="<h2>⬇ Todas las descargas</h2>"+
      DESCARGAS.slice().reverse().map(d=>`<a class="btn dl" href="${esc(safeUrl(d.u))}" target="_blank" rel="noopener">${esc(d.n)}</a>`).join("");
    return;
  }
  app.innerHTML=`<h2>Paso ${paso}/6</h2><div class="txt">${PASOS[paso-1]}</div>`+
    (paso===1&&!turnOk?'<div id="ts" style="text-align:center"></div>':'')+
    (paso===6&&fase===2?`<a class="btn yt" id="yt" href="${YT}" target="_blank" rel="noopener">▶ Entrar al canal de YouTube</a>`:'')+
    '<button id="nx"></button>';
  $("nx").onclick=next;
  if($("yt"))$("yt").onclick=()=>{ytClick=true};
  if($("ts"))drawTurnstile();
  upd();
}

function upd(){
  const b=$("nx");if(!b)return;
  if(paso===1&&!turnOk){b.disabled=true;b.textContent="Verifica que eres humano";return}
  if(fase<2){b.disabled=true;b.textContent="Espera "+Math.ceil(resto)+"s"}
  else if(paso===6&&!ytOk){b.disabled=true;b.textContent="Primero entra a YouTube y vuelve"}
  else{b.disabled=false;b.textContent="Continuar"}
}

function next(){
  if(paso<6){paso++;fase=0;resto=T1;kTrack(paso);render()}
  else{enDesc=true;fin=FINAL;kTrack(7);render()}
}

/* reloj: solo cuenta mientras la página está visible, así que ir a un anuncio y volver no reinicia nada */
setInterval(()=>{
  const now=Date.now(),dt=(now-last)/1000;last=now;
  if(document.hidden||bloqueado)return;
  if(enDesc){fin-=dt;if(fin<=0)reset();return}
  if(fase>=2)return;
  if(paso===1&&!turnOk)return;
  resto-=dt;
  if(resto<=0){
    fase++;
    if(fase===1)resto=T2;else{resto=0;render();return}
  }
  upd();
},250);

/* salir de la web 15 s o más reinicia todo (la visita a YouTube del paso 6 no cuenta) */
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  last=Date.now();
  if(paso===6&&ytClick&&!ytOk){ytOk=true;hiddenAt=0;upd();return}
  if(hiddenAt&&Date.now()-hiddenAt>=AWAY)reset();
  hiddenAt=0;
});

/* ===== Turnstile (Cloudflare) ===== */
function drawTurnstile(){
  if(window.turnstile){
    turnstile.render("#ts",{sitekey:TURNSTILE_KEY,theme:"dark",callback:()=>{turnOk=true;const t=$("ts");if(t)t.remove();upd()}});
  }else{setTimeout(()=>{if($("ts"))drawTurnstile()},500)}
}
const tsScript=document.createElement("script");
tsScript.src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit";
tsScript.async=true;document.head.appendChild(tsScript);

/* ===== Anuncios y detector de bloqueo ===== */
const AD_URL="https://al5sm.com/tag.min.js";
function bait(){
  const d=document.createElement("div");
  d.className="adsbox ad-banner pub_300x250";
  d.style.cssText="position:absolute;left:-999px;height:10px;width:10px";
  document.body.appendChild(d);
  const b=!d.offsetHeight||getComputedStyle(d).display==="none";
  d.remove();return b;
}
function setBlock(b){
  if(b&&!bloqueado){
    bloqueado=true;$("block").style.display="flex";
    reset();   /* si activan el bloqueo a mitad de uso, vuelve al 1/6 */
  }else if(!b&&bloqueado){bloqueado=false;$("block").style.display="none";last=Date.now()}
}
const ad=document.createElement("script");
ad.src=AD_URL;ad.dataset.zone="12014639";ad.async=true;
ad.onerror=()=>setBlock(true);
document.head.appendChild(ad);

$("retry").onclick=async()=>{
  $("retry").disabled=true;
  let blocked=bait();
  if(!blocked){try{await fetch(AD_URL,{mode:"no-cors",cache:"no-store"})}catch(e){blocked=true}}
  $("retry").disabled=false;
  setBlock(blocked);
};
setInterval(()=>{if(!bloqueado&&bait())setBlock(true)},5000);

/* ===== inicio ===== */
kTrack(1);
render();
</script>
</body>
</html>
