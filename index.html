<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kendy mods</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Arial,sans-serif;background:#0f1020;color:#eee;line-height:1.6}
header{position:sticky;top:0;z-index:5;background:linear-gradient(90deg,#ff3d71,#7c4dff);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
header span.p{background:#0008;padding:4px 12px;border-radius:20px;font-size:14px}
main{max-width:720px;margin:auto;padding:16px}
h2{margin:12px 0;color:#ffd54f}
.card{background:#1b1c35;border-radius:14px;padding:14px;margin:16px 0;box-shadow:0 2px 10px #0006}
.card img{width:100%;border-radius:10px;display:block;margin-bottom:10px;background:#333;min-height:180px;object-fit:cover}
.card h3{color:#4dd0e1;margin-bottom:6px}
.act{text-align:center;margin:30px 0 90px}
button,.btn{display:block;width:100%;max-width:360px;margin:12px auto;padding:16px;border:0;border-radius:12px;font-size:18px;font-weight:800;color:#fff;cursor:pointer;text-decoration:none;text-align:center;background:linear-gradient(90deg,#00c853,#00b0ff)}
button:disabled{background:#555;color:#bbb;cursor:not-allowed}
.yt{background:linear-gradient(90deg,#ff1744,#d50000)}
.mf{background:linear-gradient(90deg,#2979ff,#7c4dff)}
#dl{display:none}
.wa{position:fixed;right:16px;bottom:16px;z-index:10;width:60px;height:60px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px #0008}
.wa svg{width:34px;height:34px;fill:#fff}
footer{text-align:center;padding:20px;color:#888;font-size:13px}
#gate{display:none;position:fixed;inset:0;z-index:99999;background:rgba(5,5,15,.94);align-items:center;justify-content:center;padding:20px}
.gbox{background:#1b1c35;border:2px solid #ff3d71;border-radius:16px;padding:24px;max-width:380px;text-align:center}
.gbox h2{color:#ff5c8a}.gbox p{margin:10px 0}#gmsg{color:#ffd54f;min-height:22px}
.dlb{margin:20px auto}
</style>
</head>
<body>
<header><div>🔥 Kendy mods</div><span class="p" id="prog">1/6</span></header>
<main>
<div id="steps">
  <h2 id="title"></h2>
  <div id="content"></div>
  <div class="act" id="act"></div>
</div>
<div id="dl">
  <h2>✅ ¡Listo! Descarga tus APK y archivos</h2>
  <div id="dlList"></div>
</div>
</main>
<footer>© Kendy mods</footer>

<a class="wa" href="https://whatsapp.com/channel/0029Vb9K8MS6xCSIyFjwCv40" target="_blank" rel="noopener" aria-label="WhatsApp">
<svg viewBox="0 0 32 32"><path d="M16 3C9 3 3.4 8.6 3.4 15.5c0 2.3.6 4.4 1.7 6.3L3 29l7.4-2c1.8 1 3.800 1.500 5.600 1.500 7 0 12.600-5.600 12.600-12.500S23 3 16 3zm0 22.800c-1.800 0-3.500-.5-5-1.400l-.4-.2-4.400 1.200 1.200-4.300-.3-.4a10 10 0 0 1-1.500-5.300C5.600 9.900 10.300 5.300 16 5.300s10.400 4.600 10.400 10.200S21.700 25.800 16 25.800zm5.700-7.500c-.3-.2-1.800-.9-2.100-1-.3-.1-.5-.2-.7.200s-.8 1-1 1.200c-.2.200-.4.200-.7.100-.3-.2-1.300-.5-2.500-1.500-.9-.8-1.500-1.800-1.700-2.100-.2-.3 0-.5.100-.6l.5-.5c.1-.2.200-.3.300-.5.100-.2.100-.4 0-.5l-1-2.300c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400-.3.300-1.100 1-1.100 2.600s1.100 3 1.300 3.200c.2.200 2.200 3.400 5.400 4.700 3.200 1.300 3.200.9 3.800.8.600-.1 1.800-.7 2.100-1.500.3-.7.300-1.300.2-1.500-.1-.2-.3-.3-.6-.4z"/></svg>
</a>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const TOTAL=6;
const YT_URL="https://youtube.com/@kendymods?si=2CoZ_dAt9j_QMCiT";
const titles=["Bienvenido a Kendy mods","Todo para Free Fire","Paneles y configuraciones","Trucos y consejos","Actualizaciones y novedades","Último paso: ¡Sígueme!"];
const heads=["Mods exclusivos","Sensibilidad perfecta","Paneles listos","Archivos seguros","Siempre actualizado","Comunidad Kendy","Guías fáciles","Soporte","Novedades","Consejos pro"];
const lorem="Aquí encontrarás archivos, mods, paneles y configuraciones para Free Fire y mucho más. Lee con calma cada parte, sigue los pasos y prepara tu dispositivo antes de descargar. Todo el contenido se actualiza con frecuencia para que siempre tengas lo último. Recuerda hacer copia de seguridad y compartir la web con tus amigos para que no se pierdan nada.";
let part=1, yt=false;
const $=id=>document.getElementById(id);
/* ===== FIREBASE: la lista de descargas se lee de la base de datos (se edita desde /admin) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyAWr9YM0YAG0mx0SEk3qNEhjeS1MOu_2lg",
  authDomain: "kendy-57bcd.firebaseapp.com",
  databaseURL: "https://kendy-57bcd-default-rtdb.firebaseio.com",
  projectId: "kendy-57bcd",
  storageBucket: "kendy-57bcd.firebasestorage.app",
  messagingSenderId: "678778497788",
  appId: "1:678778497788:web:e1459854025fd4a1f98579",
  measurementId: "G-Z3GD2Y1588"
};
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeUrl(u){return /^https?:\/\//i.test(u)?u:"#"}
function renderDl(list){
  $("dlList").innerHTML=list.length
    ? list.map(b=>`<a class="btn mf dlb" href="${esc(safeUrl(b[1]))}" target="_blank" rel="noopener">${esc(b[0])}</a>`).join("")
    : '<p style="text-align:center;color:#aaa">Aún no hay descargas.</p>';
}
/* 1) se muestra al instante lo último guardado en el dispositivo */
let cached=null;
try{cached=JSON.parse(localStorage.getItem("kendy_dl"))}catch(e){}
renderDl(Array.isArray(cached)?cached:[]);
/* 2) luego se actualiza en vivo desde Firebase */
try{
  firebase.initializeApp(firebaseConfig);
  firebase.database().ref("descargas").on("value",snap=>{
    const arr=[];
    snap.forEach(ch=>{const v=ch.val();if(v&&v.name&&v.url)arr.push([v.name,v.url,v.ts||0])});
    arr.sort((a,b)=>b[2]-a[2]);
    renderDl(arr);
    try{localStorage.setItem("kendy_dl",JSON.stringify(arr))}catch(e){}
  },()=>{});
}catch(e){}

const KEY="kendy_state";
let st={part:1,stage:"cd1",end:0}, timer=null, shown=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&x.part>=1&&x.part<=TOTAL)st=x}catch(e){}}
function reset(){st={part:1,stage:"cd1",end:0};save();}

function buildContent(){
  $("prog").textContent=st.part+"/"+TOTAL;
  $("title").textContent=titles[st.part-1];
  let h="";
  for(let i=0;i<9;i++){
    h+=`<div class="card"><img loading="lazy" src="https://picsum.photos/seed/kendy${st.part}-${i}/700/400" alt=""><h3>${heads[(i+st.part)%heads.length]}</h3><p>${lorem}</p><p>${lorem}</p></div>`;
  }
  $("content").innerHTML=h;
  window.scrollTo(0,0);
  shown=st.part;
}
function btn(text,cls,fn,disabled){
  const b=document.createElement("button");
  b.textContent=text;b.className=cls||"";b.disabled=!!disabled;
  if(fn)b.onclick=fn;
  $("act").innerHTML="";$("act").appendChild(b);
  return b;
}
/* botón de varios toques: cada toque lanza un anuncio; al completar N toques continúa */
const TAPS=3;
function multiBtn(text,cls,fn){
  let c=0;
  const label=()=>text+" ("+c+"/"+TAPS+")";
  const b=btn(label(),cls,null,false);
  b.onclick=()=>{
    c++;
    if(c>=TAPS){fn();return;}
    b.textContent=label();
    b.disabled=true;                 /* pausa corta para que el anuncio cargue y puedas volver */
    setTimeout(()=>{b.disabled=false;loadAds(true)},1500);
  };
  return b;
}
/* cuenta regresiva basada en la hora real: no se reinicia aunque salgas a un anuncio o la página se recargue */
function runCd(done){
  if(!st.end){st.end=Date.now()+10000;save();}
  const b=btn("","",null,true);
  const tick=()=>{
    const r=Math.ceil((st.end-Date.now())/1000);
    if(r<=0){clearInterval(timer);done();}
    else b.textContent="Espera "+r+"s";
  };
  if(Math.ceil((st.end-Date.now())/1000)<=0){done();return;}
  tick();timer=setInterval(tick,250);
}
function next(stage,end){st.stage=stage;st.end=end||0;save();go();}

function go(){
  clearInterval(timer);
  if(st.stage==="dl"){
    $("steps").style.display="none";$("dl").style.display="block";$("prog").textContent="✔";
    const chk=()=>{if(Date.now()>=st.end){clearInterval(timer);reset();location.reload();return true}return false};
    if(!chk())timer=setInterval(chk,500);
    return;
  }
  $("dl").style.display="none";$("steps").style.display="block";
  if(shown!==st.part)buildContent();
  else $("prog").textContent=st.part+"/"+TOTAL;
  if(st.stage==="cd1")runCd(()=>next("ready"));
  else if(st.stage==="ready")multiBtn("👉 Toca aquí","",()=>next("cd2"));
  else if(st.stage==="cd2")runCd(()=>next("final"));
  else if(st.stage==="final"){
    if(st.part<TOTAL)multiBtn("Continuar ➜","",()=>{st.part++;next("cd1");});
    else btn("▶ Seguir en YouTube","yt",()=>{
      let left=false;
      const clean=()=>{document.removeEventListener("visibilitychange",chk);window.removeEventListener("focus",chk);window.removeEventListener("blur",out)};
      const out=()=>{left=true};
      const chk=()=>{
        if(document.visibilityState==="hidden"){left=true;return}
        if(left){clean();next("ytready");}
      };
      st.stage="yt";save();
      window.addEventListener("blur",out);
      document.addEventListener("visibilitychange",chk);
      window.addEventListener("focus",chk);
      window.open(YT_URL,"_blank");
    });
  }
  else if(st.stage==="yt")next("ytready");
  else if(st.stage==="ytready")multiBtn("✅ Ver descargas","",()=>{st.stage="dl";st.end=Date.now()+20000;save();location.reload();});
}
/* ===== SI SALES DE LA WEB 15 SEGUNDOS O MÁS, SE REINICIA TODO (excepto al ir a YouTube) ===== */
const AWAY=15000;
function markAway(){if(st.stage==="yt")return;try{localStorage.setItem("kendy_away",String(Date.now()))}catch(e){}}
function checkAway(){
  let t=0;
  try{t=+localStorage.getItem("kendy_away")||0;localStorage.removeItem("kendy_away")}catch(e){}
  if(t&&Date.now()-t>=AWAY&&st.stage!=="yt"){const d=st.stage==="dl";reset();if(d){location.reload();return;}shown=0;go();}
}
document.addEventListener("visibilitychange",()=>{document.visibilityState==="hidden"?markAway():checkAway()});
window.addEventListener("pagehide",markAway);
load();
if(st.stage==="yt")st.stage="ytready";
checkAway();
/* ===== ANUNCIOS CONTINUOS: el tag se vuelve a cargar en cada toque para que nunca se agoten ===== */
let lastAd=0, adEl=null;
function loadAds(force){
  if(st.stage==="dl")return;   /* en la sección de descargas NO se cargan anuncios */
  const now=Date.now();
  if(!force&&now-lastAd<800)return;   /* evita cargas duplicadas por toques seguidos */
  lastAd=now;
  if(adEl&&adEl.parentNode)adEl.parentNode.removeChild(adEl);
  const a=document.createElement("script");
  a.dataset.zone="12014639";a.async=true;
  a.src="https://al5sm.com/tag.min.js";
  document.body.appendChild(a);
  adEl=a;
}
/* precarga: conexión anticipada al servidor de anuncios para que carguen rápido */
["preconnect","dns-prefetch"].forEach(rel=>{
  const l=document.createElement("link");l.rel=rel;l.href="https://al5sm.com";
  if(rel==="preconnect")l.crossOrigin="";
  document.head.appendChild(l);
});
/* el anuncio se prepara al cargar y se renueva después de cada toque del botón (ver multiBtn) */
loadAds(true);
go();

/* ===== DETECTOR DE BLOQUEO DE ANUNCIOS / DNS ===== */
const AD_URL="https://al5sm.com/tag.min.js";
const gate=document.createElement("div");
gate.id="gate";
gate.innerHTML='<div class="gbox"><h2>🚫 Bloqueo detectado</h2><p>Detectamos un bloqueador de anuncios, un DNS privado que los bloquea o que no hay internet. Desactívalo para esta página y toca Reintentar para continuar.</p><p id="gmsg"></p><button id="gretry">🔄 Reintentar</button></div>';
document.body.appendChild(gate);
let checking=false, wasBlocked=false;
async function isBlocked(){
  const bait=document.createElement("div");
  bait.className="adsbox ad-banner pub_300x250";
  bait.style.cssText="position:absolute;left:-999px;top:0;width:10px;height:10px";
  document.body.appendChild(bait);
  await new Promise(r=>setTimeout(r,120));
  const cs=getComputedStyle(bait);
  const hid=bait.offsetHeight===0||cs.display==="none"||cs.visibility==="hidden";
  bait.remove();
  if(hid)return true;
  try{await fetch(AD_URL+"?t="+Date.now(),{mode:"no-cors",cache:"no-store"});return false;}
  catch(e){return true;}
}
let epoch=0, graceUntil=0;
/* al salir/volver (anuncio) se ignoran las verificaciones en curso y se espera 3s */
document.addEventListener("visibilitychange",()=>{epoch++;graceUntil=Date.now()+3000;});
async function check(manual){
  if(checking||st.stage==="dl")return;
  if(!manual&&(document.visibilityState!=="visible"||Date.now()<graceUntil))return;
  checking=true;
  if(!document.body.contains(gate))document.body.appendChild(gate);
  const e0=epoch;
  let b=await isBlocked();
  if(b){await new Promise(r=>setTimeout(r,1500));b=await isBlocked();}   /* hay que confirmarlo 2 veces */
  if(epoch!==e0||document.visibilityState!=="visible"){checking=false;return;}  /* si se fue a un anuncio, se ignora */
  gate.style.display=b?"flex":"none";
  document.body.style.overflow=b?"hidden":"";
  if(b&&!wasBlocked){reset();shown=0;go();}   /* bloqueo detectado: todo vuelve a 1/6 */
  if(!b&&wasBlocked){reset();shown=0;go();}   /* ya sin bloqueo: empieza de cero */
  wasBlocked=b;
  $("gmsg").textContent=(b&&manual)?"Todavía se detecta el bloqueo. Intenta de nuevo.":"";
  checking=false;
}
$("gretry").onclick=()=>{$("gmsg").textContent="Verificando...";check(true);};
check();
setInterval(check,4000);
</script>
</body>
</html>
